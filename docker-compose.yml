services:
  mysql:
    image: mysql:8.0
    container_name: english_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: english_practice
      LANG: C.UTF-8
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db.sql:/docker-entrypoint-initdb.d/db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - app_net

  backend:
    build: ./english-practice-backend
    container_name: english_backend
    restart: unless-stopped
    env_file:
      - ./english-practice-backend/.env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      FRONTEND_URL: http://localhost
      GOOGLE_CALLBACK_URL: http://localhost/api/auth/google/callback
      FACEBOOK_CALLBACK_URL: http://localhost/api/auth/facebook/callback
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app_net

  frontend:
    build: ./english-practice-frontend
    container_name: english_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - app_net

volumes:
  mysql_data:
  uploads_data:

networks:
  app_net:
